<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TastePay receipt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><div class="wrap top-row"><a class="logo" href="/" style="text-decoration:none"><span class="logo-mark">☺</span> TastePay</a></div></header>
  <main class="wrap receipt">
    <div class="card">
      <p class="eyebrow">Payment receipt · PayPal sandbox</p>
      <h1 class="r-title" id="r-title">Checking with PayPal…</h1>
      <dl id="r-rows"></dl>
      <p class="fine" id="r-note">This page asks PayPal for the order's live status every time it is opened. Sandbox: no real money moved.</p>
    </div>
  </main>
  <script type="module" src="receipt.js"></script>
</body>
</html>
